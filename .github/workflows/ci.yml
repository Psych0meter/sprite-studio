name: Checks

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.6" shellcheck-py
      - name: Python lint
        run: ruff check .
      - name: Python format
        run: ruff format --check .
      - name: Shell scripts
        run: shellcheck scripts/*.sh webapp/run.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: for f in webapp/static/*.js; do node --check "$f"; done

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest
