name: Checks

# Branch pushes only: a pull request shows the checks of its head commit, so running them again for the
# pull request would repeat the same code.
on:
  push:
    branches: ["**"]  # (naming only branches also leaves tags out: release.yml checks those)

# A newer push to the same branch makes the run of the previous one pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.6" shellcheck-py
      - name: Python lint
        run: ruff check .
      - name: Python format
        run: ruff format --check .
      - name: Shell scripts
        run: shellcheck scripts/*.sh webapp/run.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: for f in webapp/static/*.js; do node --check "$f"; done

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest
