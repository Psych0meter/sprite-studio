[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sprite-studio"
dynamic = ["version"]
description = "Train LoRAs on your own pixel-art sprites and generate new ones in the same style, from a web app or the command line."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "pillow>=10",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/Psych0meter/sprite-studio"

[tool.setuptools]
packages = []  # an application, not a library: scripts/ and webapp/ run in place

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "webapp/.venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = [
    "E501",   # long lines: the formatter decides
    "SIM108", # ternaries are not always clearer
    "B008",   # FastAPI-style defaults
]

[tool.ruff.lint.isort]
known-first-party = ["pxtool", "pxmodel", "pxcomfy", "app", "conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
